# Deployment proposal only. Creating this service incurs hosting charges.
services:
  - type: web
    name: s1-pre-int-speaking-exam-app
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: node --check server.cjs
    startCommand: node server.cjs
    autoDeployTrigger: off
    healthCheckPath: /
    disk:
      name: roster-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: MANAGER_CODE
        generateValue: true
